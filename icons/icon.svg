<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="sky" cx="50%" cy="28%" r="80%">
      <stop offset="0" stop-color="#1A1C1F"/>
      <stop offset="0.55" stop-color="#0B0E11"/>
      <stop offset="1" stop-color="#07080A"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F6E7C1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F6E7C1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8E6"/>
      <stop offset="1" stop-color="#E6D3A6"/>
    </linearGradient>
    <linearGradient id="houseA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2AEFF"/>
      <stop offset="1" stop-color="#8B6FF0"/>
    </linearGradient>
    <linearGradient id="houseJ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6BE3B8"/>
      <stop offset="1" stop-color="#2FAE85"/>
    </linearGradient>
    <radialGradient id="win" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#FFD08A"/>
      <stop offset="1" stop-color="#E3A04F"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="530" cy="330" r="190" fill="#fff"/>
      <circle cx="618" cy="268" r="168" fill="#000"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#E6E8EB">
    <circle cx="190" cy="190" r="7" opacity=".9"/>
    <circle cx="300" cy="120" r="4" opacity=".6"/>
    <circle cx="820" cy="170" r="6" opacity=".85"/>
    <circle cx="880" cy="330" r="4" opacity=".5"/>
    <circle cx="140" cy="390" r="4" opacity=".5"/>
    <circle cx="760" cy="470" r="3.5" opacity=".45"/>
    <circle cx="250" cy="480" r="3" opacity=".4"/>
  </g>
  <!-- sparkle star -->
  <path d="M800 560 l10 30 30 10 -30 10 -10 30 -10 -30 -30 -10 30 -10z" fill="#E6E8EB" opacity=".9"/>

  <!-- moon -->
  <g transform="translate(40 0)"><circle cx="500" cy="340" r="300" fill="url(#glow)"/>
  <path d="M507.7 141.3 A190 190 0 1 0 700.2 414.5 A168 168 0 0 1 507.7 141.3Z" fill="url(#moon)"/></g>

  <!-- path between the two houses -->
  <path d="M318 662 Q512 540 706 662" fill="none" stroke="#E6E8EB" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 34" opacity=".75"/>

  <!-- ground -->
  <rect y="880" width="1024" height="144" fill="#0C0F12"/>
  <rect y="878" width="1024" height="4" fill="#1F232A"/>

  <!-- partner's house (lavender) -->
  <path d="M188 760 L318 640 L448 760 L448 880 L188 880 Z" fill="url(#houseA)" stroke="url(#houseA)" stroke-width="18" stroke-linejoin="round"/>
  <rect x="290" y="770" width="56" height="56" rx="10" fill="url(#win)"/>
  <!-- my house (mint) -->
  <path d="M576 760 L706 640 L836 760 L836 880 L576 880 Z" fill="url(#houseJ)" stroke="url(#houseJ)" stroke-width="18" stroke-linejoin="round"/>
  <rect x="678" y="770" width="56" height="56" rx="10" fill="url(#win)"/>
</svg>
